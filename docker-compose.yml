# Production-like stack: PostgreSQL + API + dashboard.
# Secrets come from .env (never committed). Start with: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atlassian_agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d atlassian_agent"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      ENVIRONMENT: production
      DB_AUTO_CREATE: "false"
      DATABASE_URL: postgresql+asyncpg://agent:${POSTGRES_PASSWORD}@db:5432/atlassian_agent
      CORS_ORIGINS: '["http://localhost:8080"]'
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
